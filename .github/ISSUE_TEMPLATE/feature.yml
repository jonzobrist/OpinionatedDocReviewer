name: Feature
description: Plan a scoped feature with explicit acceptance criteria and validation evidence.
title: "[M?][area] Feature: "
labels:
  - type:feature
  - prio:p2
  - state:needs-info
body:
  - type: markdown
    attributes:
      value: |
        Use this template for net-new capability work.
        **Ready for implementation requires complete acceptance criteria and validation commands.**

  - type: dropdown
    id: milestone_hint
    attributes:
      label: Milestone hint
      description: Select the target milestone (used for triage/planning).
      options:
        - M1 Meta-first UX + synthesis orchestration
        - M2 Persona contract reliability
        - M3 Platform hardening
        - M4 Delivery throughput + API-boundary maturity
        - Unsure / needs triage
    validations:
      required: true

  - type: dropdown
    id: area_hint
    attributes:
      label: Area hint
      description: Choose the most relevant delivery area label.
      options:
        - area:backend
        - area:frontend
        - area:review-engine
        - area:meta-critic
        - area:auth
        - area:security
        - area:infra
        - area:ci
        - area:docs
    validations:
      required: true

  - type: textarea
    id: problem_statement
    attributes:
      label: Problem statement
      description: What user/business problem are we solving?
      placeholder: |
        Current state:
        Impact:
        Why this matters now:
    validations:
      required: true

  - type: textarea
    id: scope_boundaries
    attributes:
      label: Scope boundaries
      description: Define exactly what is in-scope for this issue.
      placeholder: |
        In scope:
        -
        -
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Explicit non-goals
      description: List what must not be changed as part of this issue.
      placeholder: |
        Out of scope / non-goals:
        -
        -
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Required. Use checklist format and keep criteria testable.
      placeholder: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: validation_commands
    attributes:
      label: Validation commands
      description: Required. Commands reviewers can run to verify completion.
      placeholder: |
        # Example
        cd backend
        uv run pytest -q
    validations:
      required: true

  - type: textarea
    id: risk_notes
    attributes:
      label: Risk notes
      description: Describe technical/product/security risks and mitigations.
      placeholder: |
        Risk level (low/medium/high):
        Risks:
        Mitigations:
    validations:
      required: true

  - type: textarea
    id: docs_impact
    attributes:
      label: Docs impact
      description: Required. What docs must be updated (or why none are needed)?
      placeholder: |
        Docs to update:
        - docs/...
        If none, explain why.
    validations:
      required: true
