APP_NAME = "OpinionatedDocReviewer API"
APP_VERSION = "0.1.0"
API_PREFIX = "/api"
PORT = 8006
DATABASE_URL = "sqlite:///../.run/app.db"
REDIS_URL = "redis://localhost:6379/0"
REVIEW_QUEUE_NAME = "review-jobs"
LLM_PROVIDER = "openai"
OPENAI_API_KEY = "your-key-here"
OPENAI_MODEL = "gpt-4o-mini"
OPENAI_MAX_TOKENS = 700
OPENAI_MAX_INPUT_CHARS = 12000
DOC_MAX_CHARS = 500000
COMMENT_MAX_CHARS = 4000
OPENAI_TEMPERATURE = 0.2
OPENAI_TIMEOUT_SECONDS = 30
BEDROCK_MODEL_ID = "anthropic.claude-3-5-haiku-20241022-v1:0"
BEDROCK_REGION = "us-east-1"
BEDROCK_AWS_ACCESS_KEY_ID = ""
BEDROCK_AWS_SECRET_ACCESS_KEY = ""
BEDROCK_AWS_SESSION_TOKEN = ""
REVIEW_INLINE = true
CORS_ALLOW_ORIGINS = "http://localhost:3000,http://127.0.0.1:3000,https://opinion.zlyxy.me"
CORS_ALLOW_ORIGIN_REGEX = ""
CORS_ALLOW_CREDENTIALS = false
CORS_ALLOW_METHODS = "GET,POST,PUT,PATCH,DELETE,OPTIONS"
CORS_ALLOW_HEADERS = "Authorization,Content-Type,X-Tenant-Id,X-User-Email,X-User-Id"
CORS_MAX_AGE = 600
CSRF_ENFORCE_ORIGIN = true
RATE_LIMIT_ENABLED = true
RATE_LIMIT_WINDOW_SECONDS = 60
RATE_LIMIT_MAX_REQUESTS = 180
DOC_REPO_ROOT = ".run/doc-repos"
DOC_REPO_ENABLED = true
AUTH_MODE = "oidc"
DEFAULT_TENANT_ID = "local-dev"
OIDC_ISSUER_URL = ""
OIDC_JWKS_URL = ""
OIDC_AUDIENCE = ""
OIDC_ALGORITHMS = "RS256"
OIDC_TENANT_CLAIM = "tid"
OIDC_EMAIL_CLAIM = "email"
OIDC_NAME_CLAIM = "name"
OIDC_ROLES_CLAIM = "roles"
OIDC_ADMIN_ROLE = "admin"
OIDC_ALLOW_LOCAL_HEADER_FALLBACK = true
