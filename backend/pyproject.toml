[project]
name = "opinionated-doc-reviewer-backend"
version = "0.1.0"
description = "Backend API for OpinionatedDocReviewer"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.133.0",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.14.2",
  "httpx>=0.26",
  "sqlalchemy>=2.0",
  "openai>=1.40.0",
  "argon2-cffi>=23.1.0",
  "email-validator>=2.2.0",
  "PyJWT[crypto]>=2.15.1",
  "boto3>=1.35.0",
  "redis>=5.0.4",
  "rq>=1.16.2",
  # Security floors also protect fresh installs that do not use uv.lock.
  "anyio>=4.14.2",
  "certifi>=2026.10.19",
  "dnspython>=2.9.0",
  "cryptography>=50.0.0",
  "starlette>=1.3.1",
  "urllib3>=2.8.0",
]

[project.optional-dependencies]
test = [
  "pytest>=9.0.3",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
pythonpath = ["."]
